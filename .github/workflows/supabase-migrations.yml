name: Supabase migrations

on:
  workflow_run:
    workflows:
      - App CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Confirm quality gate
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm completed App CI
        if: github.event_name == 'workflow_run'
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test -n "$APPROVED_SHA"

      - name: Checkout manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies for manual release
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Run checks for manual release
        if: github.event_name == 'workflow_dispatch'
        run: npm run check

      - name: Audit production dependencies for manual release
        if: github.event_name == 'workflow_dispatch'
        run: npm run audit:prod

  migrate-production:
    name: Apply production migrations
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect database changes
        id: database-changes
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          echo "Approved SHA: $APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- supabase/config.toml supabase/migrations supabase/schemas supabase/tests; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.database-changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.database-changes.outputs.changed == 'true'
        run: npm ci

      - name: Repair superseded migration history
        if: steps.database-changes.outputs.changed == 'true'
        run: npm run supabase:prod:migrations:repair

      - name: Preview migrations
        if: steps.database-changes.outputs.changed == 'true'
        run: npm run supabase:prod:db:dry-run

      - name: Apply migrations
        if: steps.database-changes.outputs.changed == 'true'
        run: npm run supabase:prod:db:push
