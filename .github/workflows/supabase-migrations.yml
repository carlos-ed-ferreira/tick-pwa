name: Supabase migrations

on:
  workflow_run:
    workflows:
      - App CI
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  quality-gate:
    name: Confirm quality gate
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm completed App CI
        if: github.event_name == 'workflow_run'
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test -n "$APPROVED_SHA"

      - name: Checkout manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Setup Node.js for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for manual release
        if: github.event_name == 'workflow_dispatch'
        run: make install-ci

      - name: Run checks for manual release
        if: github.event_name == 'workflow_dispatch'
        run: make check

      - name: Audit production dependencies for manual release
        if: github.event_name == 'workflow_dispatch'
        run: make audit-prod

  migrate-production:
    name: Apply production migrations
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect database changes
        id: database-changes
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          echo "Approved SHA: $APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- supabase/config.toml supabase/migrations supabase/schemas supabase/tests; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.database-changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.database-changes.outputs.changed == 'true'
        run: make install-ci

      - name: Repair superseded migration history
        if: steps.database-changes.outputs.changed == 'true'
        run: make supabase-prod-migrations-repair

      - name: Preview migrations
        if: steps.database-changes.outputs.changed == 'true'
        run: make supabase-prod-db-dry-run

      - name: Apply migrations
        if: steps.database-changes.outputs.changed == 'true'
        run: make supabase-prod-db-push

  deploy-production:
    name: Deploy production application
    needs: migrate-production
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Confirm approved SHA is still current
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          current_sha="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')"
          test "$current_sha" = "$APPROVED_SHA"

      - name: Trigger the Vercel deployment
        id: deployment
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || {
            printf '%s\n' 'Missing VERCEL_DEPLOY_HOOK_URL in the production environment.' >&2
            exit 1
          }
          response="$(curl --fail-with-body --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL")"
          job_id="$(printf '%s' "$response" | jq -er '.job.id | strings | select(length > 0)')"
          job_state="$(printf '%s' "$response" | jq -er '.job.state | strings | select(length > 0)')"
          echo "job-id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Approved SHA: $APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel deploy hook job: $job_id ($job_state)" >> "$GITHUB_STEP_SUMMARY"

  audit-production-migrations:
    name: Audit production migration history
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: make install-ci

      - name: Compare production migration history
        run: make supabase-prod-migrations-check

  report-failure:
    name: Report failed production pipeline
    needs:
      - quality-gate
      - migrate-production
      - deploy-production
      - audit-production-migrations
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Report the failed production pipeline
        uses: ./.github/actions/report-failure
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          label: pipeline-failure
          title: Pipeline de produção falhou
          assignee: ${{ github.repository_owner }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
