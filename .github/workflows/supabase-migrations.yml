name: Supabase migrations

run-name: Production ${{ inputs.expected_sha }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA approved for production
        required: true
        type: string
      request_id:
        description: Unique publication request identifier
        required: true
        type: string

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  quality-gate:
    name: Confirm quality gate
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SHA: ${{ inputs.expected_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Confirm App CI and deployment configuration
        run: make production-release-preflight

  migrate-production:
    name: Apply production migrations
    timeout-minutes: 15
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: make install-ci

      - name: Repair superseded migration history
        run: make supabase-prod-migrations-repair

      - name: Preview migrations
        run: make supabase-prod-db-dry-run

      - name: Apply migrations
        run: make supabase-prod-db-push

      - name: Confirm migration history before deployment
        run: make supabase-prod-migrations-check

  deploy-production:
    name: Deploy production application
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production

    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SHA: ${{ inputs.expected_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy approved SHA and confirm application health
        run: make production-release

  report-failure:
    name: Report failed production pipeline
    needs:
      - quality-gate
      - migrate-production
      - deploy-production
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Report the failed production pipeline
        uses: ./.github/actions/report-failure
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          label: pipeline-failure
          title: Pipeline de produção falhou
          assignee: ${{ github.repository_owner }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-sha: ${{ inputs.expected_sha }}
