config:
  edition: 3

streams:
  tick_account_poc:
    auto_subscribe: true
    queries:
      - SELECT id, user_id, name, color_hex, surface, position, use_own_name, created_at, updated_at, deleted_at, client_updated_at, revision FROM category_tags WHERE user_id = auth.user_id()
      - SELECT id, user_id, date, timezone, item_count, completed_count, category_tag_ids, category_summaries, created_at, updated_at, deleted_at, client_updated_at, revision FROM daily_entries WHERE user_id = auth.user_id()
      - SELECT id, user_id, daily_entry_id, parent_id, category_tag_id, text, scheduled_time, checked, ignored, bold, priority, collapsed, sort_rank, created_at, updated_at, deleted_at, client_updated_at, revision FROM checklist_items WHERE user_id = auth.user_id()
